# =============================================================================
# Model presets (combine with a benchmark preset, e.g. --configs noisyshape ss_only)
# =============================================================================

# DreamerV3 baseline
dreamerv3:
  model: dreamerv3

# Table 4 / Fig. 3 ablation rows on NoisyShape
dualstream:            # "+ dual-stream only"
  model: dualstream
ss_only:               # "+ SS only": inverse dynamics + InfoNCE on the encoder output
  model: dreamerv3
  use_inverse_model: True
  inv_scale: 10.0
  use_contrastive_loss: True
  contrastive_loss_scale: 1.0
  contrastive_temperature: 0.1
dualstream_ss:         # "+ dual-stream + SS": same heads on the dual-stream model
  model: dualstream
  use_inverse_ce: True
  inv_scale: 10.0
  use_contrastive_loss: True
  contrastive_loss_scale: 1.0
  contrastive_temperature: 0.1
# The two SS ablations exactly as run for the first paper version
# (misaligned inverse target on RSSM features, see models.py).
ss_only_legacy:
  model: dreamerv3
  legacy_ss_ablation: True
  use_inverse_model: True
  inv_scale: 10.0
  use_contrastive_loss: True
  contrastive_loss_scale: 1.0
  contrastive_temperature: 0.1
dualstream_ss_legacy:
  model: dualstream
  legacy_ss_ablation: True
  use_inverse_model: True
  use_inverse_ce: True
  inv_scale: 10.0
  use_contrastive_loss: True
  contrastive_loss_scale: 1.0
  contrastive_temperature: 0.1
attention_only:        # "+ attention only"
  model: attention_only

# Gradient-isolation ablations (Table 6; symbols as in the paper)
iso_star1:             # no detach A/B, with SS
  detach_attn_for_rssm: False
  detach_attn_for_recon: False
iso_star2:             # no detach A/B, no SS
  detach_attn_for_rssm: False
  detach_attn_for_recon: False
  attn_inv_scale: 0.0
  infonce_scale: 0.0
iso_star3:             # only detach B, no SS
  detach_attn_for_rssm: False
  attn_inv_scale: 0.0
  infonce_scale: 0.0
iso_star4:             # only detach B, with SS
  detach_attn_for_rssm: False

# Self-supervised signal ablations (Appendix E.3)
inv_only:
  infonce_scale: 0.0
ctr_only:
  attn_inv_scale: 0.0


debug:
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
